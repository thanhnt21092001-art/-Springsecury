name: CI-CD-Local

on:
  push:
    branches: [ production ]
  pull_request:
    branches: [ production ]
  workflow_dispatch:

jobs:
  build:
    runs-on: [self-hosted, windows, local]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'      # đổi theo project
          cache: maven

      - name: Build & test
        shell: cmd
        run: mvnw.cmd -B clean verify

      - uses: actions/upload-artifact@v4
        with:
          name: app-jar
          path: target/*.jar

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: [self-hosted, windows, local]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: app-jar
          path: target

      - name: Build Docker image
        shell: powershell
        run: docker build -t demo:latest .

      - name: Redeploy container
        shell: powershell
        run: |
          docker rm -f demo 2>$null
          docker run -d --name demo -p 8080:8080 --restart unless-stopped demo:latest