name: CI-CD-Local

on:
  push:
    branches:
      - production
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: demo-local-deployment
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: [self-hosted, windows, local]
    defaults:
      run:
        working-directory: demo1
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Build and install with Maven
        shell: pwsh
        run: .\mvnw.cmd -B clean install

      - name: Build Docker image
        shell: pwsh
        run: docker build -t demo:latest .

      - name: Deploy container locally
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace($env:FIREBASE_CREDENTIALS_PATH)) {
            throw "Set FIREBASE_CREDENTIALS_PATH on the self-hosted runner to the local Firebase service-account JSON file."
          }
          if (-not (Test-Path -LiteralPath $env:FIREBASE_CREDENTIALS_PATH -PathType Leaf)) {
            throw "Firebase credentials file not found at FIREBASE_CREDENTIALS_PATH."
          }

          docker container inspect demo *> $null
          if ($LASTEXITCODE -eq 0) {
            docker rm -f demo
            if ($LASTEXITCODE -ne 0) {
              throw "Could not remove the existing demo container."
            }
          }

          docker run -d `
            --name demo `
            --restart unless-stopped `
            -p 9999:9999 `
            -e SPRING_PROFILES_ACTIVE=uat `
            --mount "type=bind,source=$($env:FIREBASE_CREDENTIALS_PATH),target=/app/credentials/firebase.json,readonly" `
            demo:latest
          if ($LASTEXITCODE -ne 0) {
            throw "Could not start the demo container."
          }
