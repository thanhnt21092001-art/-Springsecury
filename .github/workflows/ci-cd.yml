name: CI-CD-Local

on:
  push:
    branches:
      - production
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: demo-local-deployment
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: [self-hosted, windows, local]
    defaults:
      run:
        working-directory: demo1
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Build and install with Maven
        shell: cmd
        run: .\mvnw.cmd -B clean install

      - name: Build Docker image
        shell: cmd
        run: docker build -t demo:latest .

      - name: Deploy container locally
        shell: cmd
        run: |
          if not defined FIREBASE_CREDENTIALS_PATH (
            echo FIREBASE_CREDENTIALS_PATH is not set.
            exit /b 1
          )
          if not exist "%FIREBASE_CREDENTIALS_PATH%" (
            echo Firebase credentials file was not found.
            exit /b 1
          )

          docker container inspect demo >nul 2>&1
          if not errorlevel 1 (
            docker rm -f demo
            if errorlevel 1 exit /b 1
          )

          docker run -d --name demo --restart unless-stopped -p 9999:9999 -e SPRING_PROFILES_ACTIVE=uat --mount "type=bind,source=%FIREBASE_CREDENTIALS_PATH%,target=/app/credentials/firebase.json,readonly" demo:latest
          if errorlevel 1 exit /b 1
